<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Unciv4iOS game invitation</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #09172d; color: #edf3ff; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; }
    main { width: min(32rem, calc(100% - 3rem)); padding: 2rem 0; }
    .brand { color: #a9bbdc; letter-spacing: .08em; }
    h1 { font-size: 1.8rem; margin-top: .6rem; }
    p { line-height: 1.65; }
    .details { background: #142743; border-radius: 1rem; padding: 1rem; margin: 1.5rem 0; }
    dt { color: #a9bbdc; font-size: .85rem; }
    dd { margin: .35rem 0 1rem; overflow-wrap: anywhere; }
    dd:last-child { margin-bottom: 0; }
    .actions { display: grid; gap: .8rem; }
    button, .button { box-sizing: border-box; border: 0; border-radius: .8rem; padding: .9rem 1rem; font: inherit; text-align: center; text-decoration: none; cursor: pointer; color: white; background: #2d4b79; }
    .primary { background: #247745; }
    :focus-visible { outline: 3px solid #accaff; outline-offset: 4px; }
    .hint, #status { color: #bdcce3; font-size: .92rem; }
    textarea { box-sizing: border-box; width: 100%; padding: .7rem; background: #142743; color: white; border: 1px solid #a9bbdc; border-radius: .5rem; }
    [hidden] { display: none !important; }
  </style>
  <script type="module" src="./invitation/invite.mjs"></script>
</head>
<body>
  <main>
    <div class="brand">UNCIV4IOS</div>
    <h1 id="title">Game invitation</h1>
    <p id="intro">Open this invitation on your iPhone or iPad to view the multiplayer game.</p>
    <section id="invitation" hidden>
      <dl class="details">
        <dt id="game-label">Game ID</dt><dd id="game-id"></dd>
        <dt id="server-label">Server</dt><dd id="server"></dd>
      </dl>
      <div class="actions">
        <button class="primary" id="copy" type="button">Copy invitation link</button>
        <a class="button" id="install" href="https://testflight.apple.com/join/XSgMMQjt" rel="noreferrer">Install Unciv4iOS</a>
      </div>
      <p class="hint" id="manual">In the game, go to Multiplayer → Add game by Game ID, then paste this link.</p>
      <p id="status" role="status" aria-live="polite"></p>
      <textarea id="copy-fallback" rows="4" readonly hidden aria-label="Invitation link"></textarea>
    </section>
    <p id="invalid" hidden>This invitation is invalid. Ask the creator to share a new link.</p>
    <noscript>JavaScript is needed to display this invitation. You can copy this page's full address and paste it into Multiplayer → Add game by Game ID in Unciv4iOS.</noscript>
  </main>
</body>
</html>
